name: Paper trading H4

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas: resolver + abrir apuestas nuevas
    - cron: "47 * * * *"     # cada hora: solo resolver (para ver los resultados casi en tiempo real)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-h4
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Resolver, buscar entradas y resumir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "47 * * * *" ]; then
            python paper_h4.py --sin-entradas
          else
            python paper_h4.py
          fi
          python exportar_panel.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/
          git commit -m "Paper H4 $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
