name: Descarga y análisis H2

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer mes a descargar (AAAA-MM)"
        default: "2024-01"
      por_categoria:
        description: "Mercados al azar por categoría para el historial de precios"
        default: "800"
      menciones:
        description: "Mercados de menciones para el historial de precios"
        default: "6000"

permissions:
  contents: write

jobs:
  h2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Recuperar meses ya descargados
        uses: actions/cache@v4
        with:
          path: data/meses
          key: meses-${{ github.run_id }}
          restore-keys: meses-
      - name: Paso 1 - mercados resueltos
        run: python descargar_mercados.py --desde ${{ inputs.desde }}
      - name: Paso 2 - historial de precios
        run: python descargar_precios.py --por-categoria ${{ inputs.por_categoria }} --menciones ${{ inputs.menciones }}
      - name: Paso 3 - análisis H2
        run: python analisis_h2.py
      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "polymarket-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f resultados/*.csv resultados/*.png || true
          git commit -m "Resultados H2 (ejecución ${{ github.run_id }})" || echo "sin cambios"
          (git pull --rebase -q && git push) || echo "no se pudo subir"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymarket-lab-resultados
          path: |
            data/snapshots.csv
            resultados/
